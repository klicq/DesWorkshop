<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><style>text{font-family:Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="1050" fill="#c5a7ad"/><g transform="translate(92 124) rotate(-8 235 340)"><rect x="0" y="0" width="498" height="735" fill="#ecc0ca"/><rect x="10" y="0" width="6" height="735" fill="#d5a8b6"/><text x="45" y="66" font-size="26" fill="#17382b" font-weight="600">Fieldguide</text><text x="45" y="175" font-size="67" fill="#17382b" letter-spacing="-3">A practical</text><text x="45" y="249" font-size="67" fill="#17382b" letter-spacing="-3">guide to</text><text x="45" y="323" font-size="67" fill="#17382b" letter-spacing="-3">better APIs.</text><g transform="translate(68 363) scale(0.63)" fill="none" stroke="#17382b" stroke-width="38" stroke-linecap="square"><path d="M200 400V200M200 200C200 90 90 200 90 90V20M200 270C200 160 310 270 310 160V90M200 350C200 240 30 350 30 240V170M200 195C200 85 370 195 370 85V15"/></g><text x="45" y="675" font-size="20" fill="#17382b" >Understand. Connect. Build.</text></g><g transform="translate(570 290) rotate(7 360 240)"><rect x="0" y="0" width="725" height="525" fill="#f8f4e9"/><rect x="358" y="0" width="8" height="525" fill="#ded8c9"/><text x="30" y="46" font-size="23" fill="#17382b" font-weight="600">The request journey</text><text x="30" y="94" font-size="21" fill="#17382b" >Every connection starts</text><text x="30" y="124" font-size="21" fill="#17382b" >with a clear handshake.</text><text x="30" y="177" font-size="14" fill="#17382b" >A token identifies your application.</text><text x="30" y="201" font-size="14" fill="#17382b" >A policy decides what it can do.</text><text x="30" y="225" font-size="14" fill="#17382b" >Your gateway enforces the rules.</text><rect x="30" y="265" width="293" height="133" fill="#e5e9dc"/><text x="48" y="293" font-size="17" fill="#17382b" font-weight="600">Request checklist</text><text x="48" y="326" font-size="15" fill="#17382b" >✓  Include an access token</text><text x="48" y="355" font-size="15" fill="#17382b" >✓  Check the rate limit</text><text x="48" y="384" font-size="15" fill="#17382b" >✓  Handle error responses</text><text x="30" y="487" font-size="13" fill="#17382b" >Fieldguide / Authentication</text><text x="392" y="46" font-size="22" fill="#17382b" font-weight="600">Follow a request</text><rect x="418" y="90" width="240" height="60" fill="#ecc0ca"/><text x="474" y="127" font-size="18" fill="#17382b" >Application</text><path d="M538 151V192M538 252V293M538 353V395" stroke="#17382b" stroke-width="3"/><rect x="418" y="192" width="240" height="60" fill="#17382b"/><text x="466" y="229" font-size="18" fill="#f8f4e9" >API gateway</text><rect x="418" y="294" width="240" height="60" fill="#c3e889"/><text x="479" y="331" font-size="18" fill="#17382b" >Your service</text><text x="452" y="423" font-size="16" fill="#17382b" >Response returned</text><text x="392" y="487" font-size="13" fill="#17382b" >Token → policy → service</text></g></svg>